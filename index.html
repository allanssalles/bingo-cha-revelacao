<style>
/* Conceito: mesma festa do quadro e do quiz. Fundo azul | rosa com xadrez, miolo creme de papel, cartela como cartão costurado. Um look só (claro), de propósito. */
:root {
  --blue: #A9CBE8; --blue-d: #5B8FCB; --blue-l: #DCEAF7;

  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; font-family: var(--font); color: var(--brown);
  background:
    linear-gradient(90deg, rgba(255,255,255,.42) 50%, transparent 50%) 0 0 / 44px 44px,
    linear-gradient(rgba(255,255,255,.42) 50%, transparent 50%) 0 0 / 44px 44px,
    linear-gradient(90deg, #cfe3f5 50%, #fadada 50%);
  background-attachment: fixed; -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 14px 28px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.sheet { position: relative; background: var(--cream); border-radius: 24px; padding: 18px 14px 20px; box-shadow: 0 10px 30px rgba(90,58,32,.18); }
.sheet::after { content: ""; position: absolute; inset: 6px; border-radius: 19px; border: 2px dashed rgba(138,90,59,.2); pointer-events: none; }
h1, h2, h3 { margin: 0; line-height: 1.12; text-wrap: balance; }
h1 { font-size: clamp(2rem, 9vw, 3rem); text-shadow: 3px 3px 0 var(--pink), -3px -3px 0 var(--blue); }
.tag { display: inline-block; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .75rem; color: #fff; background: var(--blue-d); padding: 5px 16px 11px; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 72%, 0 100%); }
.tag.pk { background: var(--pink-d); }
.muted { color: var(--brown-l); font-weight: 500; }
.center { text-align: center; }
.btn { display: inline-block; font-weight: 700; font-size: 1.15rem; color: #fff; background: var(--pink-d); padding: .6em 1.6em; border-radius: 999px; box-shadow: 0 6px 0 #b9566a; transition: transform .12s, box-shadow .12s; }
.btn:hover { transform: translateY(2px); box-shadow: 0 4px 0 #b9566a; } .btn:active { transform: translateY(6px); box-shadow: none; }
.btn.blue { background: var(--blue-d); box-shadow: 0 6px 0 #3f6ea5; } .btn.blue:hover { box-shadow: 0 4px 0 #3f6ea5; }
.btn.sm { font-size: .9rem; padding: .45em 1.1em; box-shadow: 0 4px 0 #b9566a; } .btn.sm.blue { box-shadow: 0 4px 0 #3f6ea5; }
.btn.ghost { background: var(--blue-l); color: var(--brown); box-shadow: none; font-weight: 600; } .btn.ghost:hover { background: var(--pink-l); transform: none; box-shadow: none; }
.btn:disabled { opacity: .5; cursor: default; }
.field { width: 100%; border: 3px solid var(--blue); background: #fff; border-radius: 16px; padding: 12px 16px; font-size: 1.2rem; font-weight: 600; text-align: center; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }

.arm { animation: wave 1.6s ease-in-out infinite; transform-origin: 66px -100px; }

.bunting { display: flex; gap: 5px; justify-content: center; margin: 10px 0; }
.bunting b { width: 34px; height: 44px; display: grid; place-items: center; padding-bottom: 8%; color: #fff; font-size: 1.15rem; background: var(--blue-d); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); }
.bunting b:nth-child(n+4) { background: var(--pink-d); } .bunting b:nth-child(4) { background: var(--gold); color: var(--brown); font-size: .85rem; }

.phead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.code { font-family: ui-monospace, Consolas, monospace; font-weight: 700; letter-spacing: .18em; background: var(--blue-l); border-radius: 10px; padding: 3px 10px; color: var(--brown); }

.chip small { display: block; font-weight: 500; color: var(--brown-l); font-size: .72rem; }
.chip.on { background: var(--pink-d); color: #fff; } .chip.on small { color: #fff; opacity: .9; }

.pat { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; }
.pat p { margin: 0; font-size: .92rem; font-weight: 500; }
.pat svg { flex: none; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.cell { position: relative; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 3px; background: #fff; border-radius: 12px; box-shadow: 0 3px 0 rgba(138,90,59,.15); font-size: clamp(.58rem, 2.7vw, .82rem); font-weight: 600; line-height: 1.08; text-align: center; overflow: hidden; transition: transform .12s; word-break: break-word; hyphens: auto; }
.cell .ic { width: clamp(24px, 9.6vw, 46px); height: auto; flex: none; }
.cell .nm { display: block; }
.cell .nm.l { font-size: .82em; letter-spacing: -.01em; }
.cell:active { transform: scale(.94); }
.cell.free { background: linear-gradient(135deg, #A9CBE8 0 50%, #F4BDBE 50% 100%); color: var(--brown); box-shadow: 0 3px 0 rgba(138,90,59,.25); }
.cell.mk { background: #FFF1CF; box-shadow: 0 0 0 3px var(--gold) inset, 0 3px 0 rgba(138,90,59,.15); }

.cell.shake { animation: shake .4s; }

.drawbtn { display: block; margin: 0 auto; font-size: clamp(1.2rem, 3vw, 2rem); padding: .6em 2em; }
.count { text-align: center; margin: 10px 0 6px; font-weight: 600; }
.drawn { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }

.dchip .ic { width: 24px; height: 24px; }
.dchip:first-child { background: var(--gold); }
.mini { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 10px; }
.mini .mc { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: #fff; border-radius: 8px; font-size: .62rem; font-weight: 600; line-height: 1.02; padding: 2px; overflow: hidden; word-break: break-word; gap: 1px; }
.mini .mc .ic { width: 52%; height: auto; }
.mini .mc.hit { background: var(--ok-l); box-shadow: 0 0 0 2px var(--ok) inset; }
.mini .mc.line { background: var(--gold); }
.mini .mc.free { background: var(--gold); }

.verdict.ok { background: var(--ok-l); color: #1f7a50; } .verdict.no { background: var(--bad-l); color: #a2323b; }
.win { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 2px dashed rgba(138,90,59,.15); }
.win:last-child { border: 0; }
.win b { color: var(--pink-d); }
.hint { font-size: .85rem; }
.host.tv .hbar, .host.tv .hrounds, .host.tv .side, .host.tv .count + .hint { display: none; }
.host.tv .hmain { grid-template-columns: 1fr; }
.host.tv .big { min-height: 52vh; }
.host.tv .big .ic { width: clamp(180px, 30vw, 420px); }
.host.tv .big .bnm { font-size: clamp(3rem, 9vw, 7rem); }
.tvexit { position: fixed; right: 12px; bottom: 12px; z-index: 30; opacity: .5; }
.tvexit:hover { opacity: 1; }
@media (max-width: 900px) { .hmain { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; }
</style>

/* 45 itens do chá de bebê e do chá revelação. A ordem bate com os ícones (ICON_FN). Cada cartela leva 24 deles. */
const POOL = ["Fralda", "Body", "Chupeta", "Mamadeira", "Carrinho de bebê", "Berço", "Mordedor", "Chocalho", "Móbile", "Ursinho",

const ROUNDS = [
  { name: "Uma linha", desc: "Complete qualquer linha na horizontal.", sample: [10, 11, 12, 13, 14] },
  { name: "Uma coluna", desc: "Complete qualquer coluna na vertical.", sample: [2, 7, 12, 17, 22] },

function lines(r) {
  const idx = (f) => Array.from({ length: 5 }, (_, k) => f(k));
  if (r === 0) return Array.from({ length: 5 }, (_, i) => idx(k => i * 5 + k));

const ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

/* cartela: 25 posições; -1 = espaço livre no centro. Sempre a mesma para o mesmo código. */
function cardFor(code) {
  const rng = mulberry32(xmur3("bingo-cha-" + code)());

  const pick = ids.slice(0, 24); pick.splice(12, 0, -1);

}

let P = store.get("bingo-player-v1", null);
const saveP = () => store.set("bingo-player-v1", P);

function renderPlayer() {
  document.title = "Bingo do Chá Revelação";
  if (!P) return renderWelcome();
  const card = cardFor(P.code), marked = P.marks.map((m, i) => card[i] === -1 || m);
  const r = P.round, miss = missing(marked, r), line = bestLine(marked, r);
  $("#app").innerHTML = `<div class="wrap"><div class="sheet">
    <div class="phead"><div><div class="muted" style="font-size:.85rem">Cartela de</div><b style="font-size:1.3rem">${esc(P.name)}</b></div>
      <div style="text-align:right"><div class="muted" style="font-size:.85rem">Seu código</div><span class="code">${P.code}</span></div></div>
    <div class="chips" id="rchips">${ROUNDS.map((x, i) => `<button class="chip ${i === r ? "on" : ""}" data-r="${i}">Rodada ${i + 1}<small>${x.name}</small></button>`).join("")}</div>
    <div class="pat">${patSVG(r, 64)}<p><b>${ROUNDS[r].name}.</b> ${ROUNDS[r].desc}</p></div>
    <div class="grid" id="grid">${card.map((id, i) => id === -1
      ? `<div class="cell free">${STAR_SVG}<span class="nm">Chá revelação</span></div>`
      : `<button class="cell ${P.marks[i] ? "mk" : ""}" data-i="${i}">${ICON_SVG(id)}<span class="nm ${POOL[id].length > 10 ? "l" : ""}">${esc(POOL[id])}</span></button>`).join("")}</div>
    <div class="prog">${line ? `<b>BINGO!</b> Mostre sua cartela ao anfitrião` : miss === 1 ? `Falta <b>1</b> para o bingo!` : `Faltam <b>${miss}</b> para o bingo`}</div>
    <p class="muted center hint" style="margin:6px 0 12px">Toque no item quando ele sair no telão.</p>
    <div class="row"><button class="btn sm ghost" id="clear">Limpar marcações</button><button class="btn sm ghost" id="leave">Trocar de convidado</button>${line ? `<button class="btn sm" id="showb">Mostrar meu bingo</button>` : ""}</div>
  </div></div>`;
  $("#rchips").onclick = e => { const b = e.target.closest(".chip"); if (!b) return; P.round = +b.dataset.r; saveP(); renderPlayer(); };
  $("#grid").onclick = e => {
    const b = e.target.closest(".cell[data-i]"); if (!b) return;
    const i = +b.dataset.i; audio(); P.marks[i] = !P.marks[i]; saveP(); if (P.marks[i]) SND.stamp();
    const mk = P.marks.map((m, k) => card[k] === -1 || m), had = !!P.shown[P.round];
    if (bestLine(mk, P.round) && !had) { P.shown[P.round] = true; saveP(); renderPlayer(); bingoOverlay(); return; }
    renderPlayer();
  };
  $("#clear").onclick = () => { P.marks = Array(25).fill(false); P.shown = {}; saveP(); renderPlayer(); toast("Cartela limpa para a próxima rodada."); };
  let armed = 0;
  $("#leave").onclick = () => { if (Date.now() - armed < 4000) { P = null; store.del("bingo-player-v1"); renderPlayer(); } else { armed = Date.now(); toast("Toque de novo para trocar de convidado. A cartela atual será apagada."); } };
  if ($("#showb")) $("#showb").onclick = bingoOverlay;
}
function bingoOverlay() {
  audio(); SND.bingo(); burst(innerWidth / 2, innerHeight * .35, 160); rain(90);
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="modal"><div class="tag pk">Rodada ${P.round + 1} · ${ROUNDS[P.round].name}</div><h2>BINGO!</h2>
    <p style="font-size:1.4rem;font-weight:700;margin:8px 0 2px">${esc(P.name)}</p><span class="code">${P.code}</span>
    <p class="muted" style="margin:14px 0">Mostre esta tela ao anfitrião para ele conferir a sua cartela.</p>
    <button class="btn" id="bclose">Continuar</button></div>`;
  document.body.appendChild(o); $("#bclose").onclick = () => o.remove();
}
function renderWelcome() {

async function sha(s) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }

function renderLogin() {
  $("#app").innerHTML = `<div class="wrap"><div class="sheet center">
    <span class="tag pk">Anfitrião</span><h1 style="margin-top:10px">Bingo do Chá Revelação</h1>

    <form id="lf"><input class="field" id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Senha" aria-label="Senha do anfitrião"><div style="margin-top:14px"><button class="btn" type="submit">Entrar</button></div></form>
    <p class="muted hint" style="margin:14px 0 0">Convidados entram pelo QR code, sem senha.</p></div></div>`;
  $("#lf").onsubmit = async e => {
    e.preventDefault(); let ok = false;
    try { ok = (await sha(PIN_SALT + $("#pin").value.trim())) === PIN_HASH; } catch (er) { toast("Este navegador não consegue conferir a senha."); return; }
    if (ok) { unlocked = true; try { sessionStorage.setItem("bingo-host-ok", "1"); } catch (er) {} audio(); renderHost(); }
    else { SND.no(); toast("Senha incorreta."); $("#pin").value = ""; $("#pin").focus(); }
  };
}

  $("#snd").onclick = () => { soundOn = !soundOn; paintToggles(); };
  let armed = 0;
  $("#reset").onclick = () => { if (Date.now() - armed < 4000) { H = { round: 0, drawn: {}, current: null, winners: {}, voice: H.voice }; saveH(); vcode = ""; vresult = null; renderHost(); toast("Jogo reiniciado."); } else { armed = Date.now(); toast("Toque de novo em 4 segundos para apagar sorteios e vencedores."); } };
  paintToggles(); paintRounds(); paintMain(); paintCheck(); paintWins();
}
function paintToggles() { $("#voice").textContent = H.voice ? "Voz: ligada" : "Voz: desligada"; $("#snd").textContent = soundOn ? "Som: ligado" : "Som: desligado"; }
function paintRounds() {
  $("#hr").innerHTML = ROUNDS.map((x, i) => `<button class="chip ${i === H.round ? "on" : ""} ${H.winners[i] ? "won" : ""}" data-r="${i}">Rodada ${i + 1}<small>${x.name}</small></button>`).join("");
  $("#hr").onclick = e => { const b = e.target.closest(".chip"); if (!b || busy) return; H.round = +b.dataset.r; const l = drawnList(); H.current = l.length ? l[l.length - 1] : null; saveH(); vresult = null; paintRounds(); paintMain(); paintCheck(); };
}
function bigHTML(id, rolling) {
  if (id == null) return `${ICON_SVG(3)}<div class="bnm muted">Pronto para sortear</div>`;
  return `${ICON_SVG(id)}<div class="bnm">${esc(POOL[id])}</div>`;
}
function paintMain() {
  const l = drawnList(), r = H.round, done = !!H.winners[r];
  $("#mainp").innerHTML = `<div class="row" style="justify-content:space-between"><div><span class="tag ${r % 2 ? "pk" : ""}">Rodada ${r + 1} · ${ROUNDS[r].name}</span></div><div class="pat" style="margin:0;padding:6px 10px">${patSVG(r, 44)}<p class="hint">${ROUNDS[r].desc}</p></div></div>
    <div class="big" id="big">${bigHTML(H.current)}</div>
    <button class="btn drawbtn" id="draw">${l.length ? "Sortear próximo item" : "Sortear primeiro item"}</button>
    <div class="count" id="cnt">Saíram <b>${l.length}</b> de ${POOL.length}</div>
    <p class="muted center hint" style="margin:0 0 8px">${done ? `Rodada ${r + 1} já tem vencedor. Escolha a próxima rodada acima.` : "Quando alguém gritar BINGO, confira o código da cartela ao lado."}</p>
    <div class="drawn" id="drawn">${[...l].reverse().map(id => `<span class="dchip">${ICON_SVG(id)}${esc(POOL[id])}</span>`).join("")}</div>`;
  $("#draw").onclick = draw;
}
async function draw() {
  if (busy) return; const used = new Set(drawnList()), left = POOL.map((_, i) => i).filter(i => !used.has(i));
  if (!left.length) return toast("Todos os itens já saíram nesta rodada.");
  busy = true; audio(); const btn = $("#draw"), big = $("#big"); btn.disabled = true; big.className = "big rolling";
  const pick = left[rint(left.length)], steps = reduce ? 3 : 15;
  for (let s = 0; s < steps; s++) { big.innerHTML = bigHTML(left[rint(left.length)]); SND.tick(s); await sleep(55 + s * s * 1.7); }
  (H.drawn[H.round] = H.drawn[H.round] || []).push(pick); H.current = pick; saveH();
  big.className = "big landed"; big.innerHTML = bigHTML(pick); SND.ding(); const r = big.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 70, .8);
  if (H.voice) speak(POOL[pick]);
  busy = false; paintMain();
}
function paintCheck() {
  $("#chk").innerHTML = `<h3>Conferir cartela</h3><form id="cf" class="row" style="flex-wrap:nowrap"><input class="field" id="cin" maxlength="8" autocomplete="off" placeholder="Código, ex.: 7QK2" value="${esc(vcode)}" aria-label="Código da cartela" style="font-family:ui-monospace,Consolas,monospace;letter-spacing:.15em"><button class="btn sm" type="submit">Conferir</button></form><div id="cres"></div>`;
  $("#cf").onsubmit = e => { e.preventDefault(); vcode = normCode($("#cin").value); verify(); };
  if (vresult) showResult();
}
function verify() {
  if (vcode.length !== 4) { vresult = null; paintCheck(); return toast("O código tem 4 letras ou números."); }
  const card = cardFor(vcode), drawn = new Set(drawnList()), marked = card.map(id => id === -1 || drawn.has(id)), line = bestLine(marked, H.round);
  const prev = Object.entries(H.winners).find(([, w]) => w.code === vcode);
  vresult = { card, marked, line, miss: missing(marked, H.round), prev: prev ? +prev[0] : null };
  audio(); line && !prev ? SND.ok() : SND.no(); paintCheck();
}
function showResult() {
  const { card, marked, line, miss, prev } = vresult, ls = new Set(line || []);
  let v;
  if (prev != null) v = `<div class="verdict no">Esta cartela já venceu a rodada ${prev + 1}. Cada convidado vence uma vez.</div>`;
  else if (line) v = `<div class="verdict ok">BINGO VÁLIDO! A cartela completa o padrão da rodada ${H.round + 1} só com itens sorteados.</div>`;
  else v = `<div class="verdict no">Ainda não é bingo: faltam ${miss} item(ns) sorteado(s) para completar "${ROUNDS[H.round].name}".</div>`;
  $("#cres").innerHTML = `<div class="mini">${card.map((id, i) => id === -1 ? `<div class="mc free">${STAR_SVG}</div>` : `<div class="mc ${ls.has(i) ? "line" : marked[i] ? "hit" : ""}">${ICON_SVG(id)}${esc(POOL[id])}</div>`).join("")}</div>${v}
    ${line && prev == null && !H.winners[H.round] ? `<form id="wf2" class="row" style="margin-top:10px;flex-wrap:nowrap"><input class="field" id="wname" maxlength="24" placeholder="Nome do vencedor" aria-label="Nome do vencedor" style="font-size:1rem"><button class="btn sm" type="submit">Confirmar vencedor</button></form>` : ""}
    ${line && prev == null && H.winners[H.round] ? `<p class="muted hint">A rodada ${H.round + 1} já tem vencedor: ${esc(H.winners[H.round].name)}.</p>` : ""}`;
  if ($("#wf2")) $("#wf2").onsubmit = e => {
    e.preventDefault(); const name = $("#wname").value.trim() || "Convidado";
    H.winners[H.round] = { name, code: vcode, at: Date.now() }; saveH(); vresult = null; vcode = "";
    audio(); SND.bingo(); burst(innerWidth / 2, innerHeight * .4, 180); rain(100); if (H.voice) speak("Bingo! Parabéns, " + name);
    paintRounds(); paintMain(); paintCheck(); paintWins(); toast("Vencedor da rodada " + (H.round + 1) + ": " + name);
  };
}
function paintWins() {
  $("#wins").innerHTML = `<h3>Vencedores</h3>${ROUNDS.map((x, i) => `<div class="win"><span>Rodada ${i + 1} · ${x.name}</span>${H.winners[i] ? `<b>${esc(H.winners[i].name)} <span class="code">${H.winners[i].code}</span></b>` : `<span class="muted">sem vencedor</span>`}</div>`).join("")}`;
}
function showQR() {
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="modal qr"><h2>Entre no bingo</h2><p class="muted" style="margin:6px 0 0">Aponte a câmera do celular para o QR code.</p>
    <div class="qrbox">${QR_SVG || "<p>QR code não configurado.</p>"}</div><div class="url">${esc(SHARE_URL)}</div>
    <div class="row" style="margin-top:14px"><button class="btn sm blue" id="qcopy">Copiar link</button><button class="btn sm ghost" id="qclose">Fechar</button></div></div>`;
  document.body.appendChild(o);
  $("#qclose").onclick = () => o.remove(); o.addEventListener("click", e => { if (e.target === o) o.remove(); });
  $("#qcopy").onclick = async () => { try { await navigator.clipboard.writeText(SHARE_URL); toast("Link copiado."); } catch (e) { toast("Selecione o link e copie."); } };
}

/* ============ roteamento ============ */
function route() { if (location.hash === "#anfitriao") (unlocked ? renderHost() : renderLogin()); else renderPlayer(); }
addEventListener("hashchange", route);
addEventListener("keydown", e => { if (e.key === "Escape" && tv) { tv = false; try { document.fullscreenElement && document.exitFullscreen(); } catch (er) {} renderHost(); } });
route();
</script>
</body></html>
